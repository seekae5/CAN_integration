[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "can-integration"
version = "0.1.0"
description = "Schlanker CAN-Zugriff für Prüfstandsmessungen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-can>=4.4,<5",
]

[project.optional-dependencies]
# Nur fuer den Zwei-Prozess-Betrieb der Simulation: 'virtual' ist in
# python-can eingebaut und prozesslokal, 'udp_multicast' braucht msgpack.
sim = ["msgpack"]

[project.scripts]
can-integration = "can_integration.cli:run"
can-integration-sim = "can_integration.sim.cli:run"

[project.urls]
Repository = "https://github.com/seekae5/CAN_integration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
can_integration = ["py.typed"]
